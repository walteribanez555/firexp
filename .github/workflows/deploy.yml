name: Deploy (CDK)

# Manual only — deploying creates/mutates real AWS resources and costs money.
# Auth: the `infra-deploy` IAM user's keys as repo secrets AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY. Rollback = run this workflow from an older tag (the
# dispatch ref is checked out and redeployed).
#
# Fully autonomous: `cdk deploy --all` builds & pushes the relay image
# (ContainerImage.fromAsset) and wires every cross-stack URL itself. No manual
# ECR / docker / ecs steps.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: "24"

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Enable arm64 emulation so cdk-assets can build the Graviton relay image
      # on the amd64 runner (fromAsset → docker build --platform linux/arm64).
      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3

      - name: Install deps + build shared types
        run: |
          npm ci
          npm run build --workspace @fire-stick/types

      - name: Install CDK deps
        working-directory: infra/cdk
        run: npm ci --no-audit --no-fund

      # Idempotent — no-op if the account/region is already bootstrapped.
      - name: CDK bootstrap
        working-directory: infra/cdk
        run: npx cdk bootstrap "aws://$(aws sts get-caller-identity --query Account --output text)/${{ env.AWS_REGION }}"

      # One shot: content + ai + relay (CDK orders by dependency, builds the
      # relay image, imports the content-api URL automatically).
      - name: cdk deploy --all
        working-directory: infra/cdk
        env:
          ENV: ${{ github.event.inputs.environment }}
        run: npx cdk deploy --all -c environment=$ENV --require-approval never

      - name: Seed DynamoDB
        working-directory: apps/content-api
        env:
          ENV: ${{ github.event.inputs.environment }}
        run: |
          AWS_REGION=${{ env.AWS_REGION }} \
          SERIES_TABLE=firexp-$ENV-series \
          EPISODES_TABLE=firexp-$ENV-episodes \
          SESSIONS_TABLE=firexp-$ENV-sessions \
          npx ts-node -r tsconfig-paths/register scripts/dynamo-init.ts

      - name: Relay endpoint (dev)
        if: ${{ github.event.inputs.environment == 'dev' }}
        run: bash infra/scripts/relay-ip.sh "firexp-dev-relay-cluster" "firexp-dev-relay" || true
