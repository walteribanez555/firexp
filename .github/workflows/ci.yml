name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ─── Node: install, build, test ───────────────────────────────────────────
  node:
    name: Node build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Build the shared types package first (other workspaces depend on it)
      - name: Build @fire-stick/types
        run: npm run build --workspace @fire-stick/types

      # Build all Node/TS apps that don't require AWS or a device
      - name: Build relay
        run: npm run build --workspace relay

      - name: Build content-api
        run: npm run build --workspace content-api

      - name: Build prompt-generator
        run: npm run build --workspace prompt-generator

      - name: Build content-dashboard
        run: npm run build --workspace content-dashboard

      - name: Build phone
        run: npm run build --workspace phone
        continue-on-error: true   # Vite/RN build may not be fully wired yet

      # Run tests across all workspaces — --if-present skips workspaces without a test script
      - name: Run all workspace tests
        run: npm test --workspaces --if-present
        env:
          # Use in-memory storage so no AWS/DynamoDB is needed in CI
          STORAGE: memory
          NODE_ENV: test

  # ─── Android: compile Kotlin (optional, never blocks) ─────────────────────
  android:
    name: Android compile check
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: adoptium

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile Debug Kotlin
        working-directory: apps/fire-hack
        run: ./gradlew :app:compileDebugKotlin --no-daemon
